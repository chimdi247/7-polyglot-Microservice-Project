server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Mirrors frontend/vite.config.js's dev-server proxy exactly: strip the
    # /api/<service> prefix and forward to that service's container.
    #
    # Each upstream is set through a variable and resolved at request time via
    # Docker's embedded DNS. Without this, nginx resolves the hostnames once at
    # startup, so (a) it refuses to start if any backend is down, and (b) it
    # keeps a stale IP (-> 502) after a backend container is recreated.
    # With a variable in proxy_pass, nginx no longer strips the matched prefix,
    # hence the explicit rewrite in every block.

    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/auth/ {
        set $upstream http://auth-service:8081;
        rewrite ^/api/auth/(.*)$ /$1 break;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/catalog/ {
        set $upstream http://catalog-service:8082;
        rewrite ^/api/catalog/(.*)$ /$1 break;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/inventory/ {
        set $upstream http://inventory-service:8083;
        rewrite ^/api/inventory/(.*)$ /$1 break;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/orders/ {
        set $upstream http://order-service:8084;
        rewrite ^/api/orders/(.*)$ /$1 break;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/payments/ {
        set $upstream http://payment-service:8085;
        rewrite ^/api/payments/(.*)$ /$1 break;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/notifications/ {
        set $upstream http://notification-service:8086;
        rewrite ^/api/notifications/(.*)$ /$1 break;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/analytics/ {
        set $upstream http://analytics-service:8087;
        rewrite ^/api/analytics/(.*)$ /$1 break;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
}
