server.port=8081
spring.application.name=auth-service
spring.datasource.url=${AUTH_DB_URL:jdbc:postgresql://127.0.0.1:5432/auth_db}
spring.datasource.username=${DB_USER:microapp}
spring.datasource.password=${DB_PASSWORD:microapp123}

# Prometheus metrics -- scraped directly by Prometheus at
# /actuator/prometheus (see observability/prometheus/prometheus.yml).
# Complements the OpenTelemetry Java agent (traces/logs), which is
# attached at the JVM level via -javaagent and needs no code/config
# here -- see Dockerfile and docker-compose.yml.
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
