# NOTE: unlike Grafana's provisioning files, Alertmanager's config
# does NOT support ${VAR} environment-variable interpolation -- these
# values are literal and must be edited directly in this file (then
# `docker compose restart alertmanager`), not through .env. See
# observability/README.md.

global:
  resolve_timeout: 5m
  smtp_smarthost: "smtp.example.com:587"
  smtp_from: "alerts@example.com"
  smtp_auth_username: "alerts@example.com"
  smtp_auth_password: "changeme"
  smtp_require_tls: false

route:
  receiver: ops-email
  group_by: ["alertname", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - receiver: ops-email
      matchers:
        - severity = "critical"
      repeat_interval: 1h

receivers:
  - name: ops-email
    email_configs:
      - to: "admin@example.com"
        send_resolved: true

inhibit_rules:
  - source_matchers:
      - alertname = "ServiceDown"
    target_matchers:
      - severity = "warning"
    equal: ["instance"]
